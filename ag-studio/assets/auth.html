<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="color-scheme" content="light dark">
<meta name="i18n-title" content="auth.doctitle">
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);if(localStorage.getItem('lang')==='ro'){d.lang='ro';d.setAttribute('data-lang','ro');d.classList.add('i18n-pending');setTimeout(function(){d.classList.remove('i18n-pending');},800);}}catch(e){}})();</script>
<title>Sign in · GeoSolver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%231f4fa0' stroke-width='2.2'/%3E%3Cpath d='M16 4.6 26.2 22H5.8Z' fill='none' stroke='%231f4fa0' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .auth-page { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .auth-main { display: grid; justify-items: center; align-content: start; padding: clamp(24px, 9vh, 96px) var(--s4) var(--s6); gap: var(--s5); }
  .auth-card { width: min(100%, 420px); padding: var(--s5); display: grid; gap: var(--s4); }
  .auth-card .tabs { width: 100%; }
  .auth-card .tabs > button { flex: 1; min-height: 36px; font-size: var(--fs-14); }
  .auth-card h1 { font-family: var(--font-math); font-size: var(--fs-25); font-weight: 600; letter-spacing: -0.005em; }
  .auth-card .sub { color: var(--text-2); margin-top: 4px; }
  .auth-form { display: grid; gap: var(--s4); }
  .pw-wrap { position: relative; }
  .pw-wrap .input { padding-right: 46px; }
  .pw-toggle { position: absolute; right: 2px; top: 2px; width: 40px; height: calc(100% - 4px); }
  .field-msg { min-height: 1.25rem; font-size: var(--fs-13); color: var(--text-2); display: flex; gap: 6px; align-items: center; }
  .field-msg:empty { display: none; }
  .auth-form .field { gap: 6px; }
  .field-msg.is-err { color: var(--false); }
  .field-msg.is-ok { color: var(--proved); }
  .field-msg svg { width: 14px; height: 14px; flex: none; }
  .form-msg:empty { display: none; }
  .form-msg .banner { animation: rise 160ms ease-out; }
  .form-msg .banner { margin: 0; }
  .auth-submit { width: 100%; min-height: 44px; font-size: var(--fs-16); }
  .auth-submit .spinner { width: 16px; height: 16px; }
  .back { font-size: var(--fs-14); display: inline-flex; gap: 6px; align-items: center; text-decoration: none; min-height: 32px; }
  .back:hover { text-decoration: underline; }
  @media (max-width: 480px) { .auth-card { padding: var(--s4); } }
</style>
<script src="/assets/i18n.js"></script>
</head>
<body>
<div class="auth-page">
  <header class="site-header roomy">
    <div class="inner">
      <a class="wordmark" href="/" data-i18n-attr="aria-label:nav.home" aria-label="GeoSolver home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 4.6 26.2 22H5.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>GeoSolver</span>
      </a>
      <div class="spacer"></div>
      <div class="header-tools">
        <div class="seg lang-seg" role="group" data-i18n-attr="aria-label:lang.label" aria-label="Language">
          <button type="button" data-lang-set="en" aria-pressed="true" lang="en">EN</button>
          <button type="button" data-lang-set="ro" aria-pressed="false" lang="ro">RO</button>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Color theme"></button>
      </div>
    </div>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card card" aria-labelledby="heading">
      <div class="seg tabs" role="tablist" data-i18n-attr="aria-label:auth.tabs" aria-label="Sign in or create an account">
        <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form" tabindex="0" data-i18n="nav.signin">Sign in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="form" tabindex="-1" data-i18n="nav.create">Create account</button>
      </div>
      <div>
        <h1 id="heading">Welcome back</h1>
        <p class="sub" id="subhead">Sign in to solve, save and revisit your proofs.</p>
      </div>
      <form class="auth-form" id="form" role="tabpanel" aria-labelledby="heading" novalidate>
        <div class="field">
          <label for="username" data-i18n="auth.username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required aria-describedby="user-msg">
          <p class="field-msg" id="user-msg"></p>
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="pass-msg">
            <button type="button" class="icon-btn pw-toggle" id="pw-toggle" aria-pressed="false" data-i18n-attr="aria-label:auth.show;title:auth.show" aria-label="Show password" aria-controls="password"></button>
          </div>
          <p class="field-msg" id="pass-msg"></p>
        </div>
        <div class="form-msg" id="form-msg"></div>
        <button type="submit" class="btn btn-primary auth-submit" id="submit">Sign in</button>
      </form>
    </section>
    <a class="back" href="/"><span aria-hidden="true">←</span><span data-i18n="nav.back">Back to GeoSolver</span></a>
  </main>
  <div></div>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/auth.js"></script>
</body>
</html>
