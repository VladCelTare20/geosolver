<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
<script>(function(){try{var l=localStorage.getItem('lang')||'en';document.documentElement.lang=l;
document.documentElement.setAttribute('data-lang',l);if(l!=='en'){document.documentElement.style.visibility='hidden';
setTimeout(function(){document.documentElement.style.visibility='';},1000);}}catch(e){}})();</script>
<title data-i18n="auth.doctitle">Sign in · GeoSolver</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="%232456a6" stroke-width="2"/><path d="M16 4.6 L26.2 22 L5.8 22 Z" fill="none" stroke="%232456a6" stroke-width="2" stroke-linejoin="round"/></svg>' />
<style>
  :root {
    --paper: #f7f7f5; --card: #ffffff; --well: #f2f2ef;
    --ink: #1b1f24; --muted: #61686f; --line: #e3e4e1; --line-strong: #cfd1cd;
    --accent: #2456a6; --accent-hover: #1c4589; --accent-ink: #ffffff;
    --ok: #1e7b34; --err: #b3261e;
    --err-bg: #faeeed; --err-line: #e8c4c0;
    --ok-bg: #edf6ef; --ok-line: #bfe0c6;
    --serif: 'Charter','Bitstream Charter','Iowan Old Style',Georgia,'Times New Roman',serif;
    --sans: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16181b; --card: #1d2024; --well: #191c1f;
      --ink: #e6e8ea; --muted: #9aa2aa; --line: #2b2f34; --line-strong: #3b4046;
      --accent: #86abdd; --accent-hover: #9dbce6; --accent-ink: #10131a;
      --ok: #63b077; --err: #e0796f;
      --err-bg: #2a1d1c; --err-line: #4f302d;
      --ok-bg: #1a251c; --ok-line: #2f4d35;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; font-size:15px; line-height:1.5; display:grid; place-items:center; padding:28px 18px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell { width:100%; max-width:400px; }
  .wordmark { display:flex; align-items:center; justify-content:center; gap:11px; margin-bottom:22px; }
  .wordmark svg { width:28px; height:28px; color:var(--accent); }
  .wordmark .name { font-family:var(--serif); font-size:22px; font-weight:600; letter-spacing:.01em; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 24px 24px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  h1 { font-family:var(--serif); font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 18px; }

  .seg { display:flex; gap:2px; background:var(--well); border:1px solid var(--line); border-radius:999px;
    padding:3px; margin-bottom:20px; }
  .seg button { flex:1; border:none; background:transparent; color:var(--muted); font:inherit; font-size:14px;
    font-weight:500; padding:7px 0; border-radius:999px; cursor:pointer; }
  .seg button[aria-selected="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }

  label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin:0 0 5px; }
  .field { margin-bottom:15px; }
  input { width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--well);
    border:1px solid var(--line-strong); border-radius:var(--radius); padding:10px 12px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:5px; }

  button.primary { width:100%; border:none; background:var(--accent); color:var(--accent-ink); font:inherit;
    font-size:15px; font-weight:600; padding:11px 0; border-radius:var(--radius); cursor:pointer; margin-top:4px; }
  button.primary:hover { background:var(--accent-hover); }
  button.primary:disabled { opacity:.6; cursor:progress; }

  .banner { display:none; font-size:13.5px; padding:9px 12px; border-radius:var(--radius); margin-bottom:16px; }
  .banner.err { display:block; background:var(--err-bg); border:1px solid var(--err-line); color:var(--err); }
  .banner.ok { display:block; background:var(--ok-bg); border:1px solid var(--ok-line); color:var(--ok); }

  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:18px; }
  .lang-seg { position:fixed; top:calc(16px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
    display:inline-flex; height:34px; background:var(--card); border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; }
  .lang-seg button { border:none; background:transparent; color:var(--muted); font:inherit; font-size:12.5px;
    font-weight:700; letter-spacing:.03em; padding:0 11px; cursor:pointer; }
  .lang-seg button + button { border-left:1px solid var(--line-strong); }
  .lang-seg button:hover { color:var(--accent); }
  .lang-seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
</style>
</head>
<body>
  <div class="lang-seg" role="group" aria-label="Language / Limbă">
    <button type="button" data-lang-set="en" aria-pressed="true">EN</button>
    <button type="button" data-lang-set="ro" aria-pressed="false">RO</button>
  </div>
  <main class="shell">
    <div class="wordmark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 4.6 L26.2 22 L5.8 22 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="name">GeoSolver</span>
    </div>
    <div class="card">
      <div class="seg" role="tablist" aria-label="Sign in or create account">
        <button id="tab-login" role="tab" aria-selected="true" data-i18n="nav.signin">Sign in</button>
        <button id="tab-register" role="tab" aria-selected="false" data-i18n="nav.create">Create account</button>
      </div>
      <h1 id="heading">Welcome back</h1>
      <p class="sub" id="subhead">Sign in to solve, save, and revisit your proofs.</p>
      <div class="banner" id="banner" role="alert"></div>
      <form id="form" autocomplete="on" novalidate>
        <div class="field">
          <label for="username" data-i18n="auth.username">Username</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none"
                 spellcheck="false" minlength="3" maxlength="32" required />
          <div class="hint" id="user-hint" data-i18n="auth.user_hint" hidden>3–32 characters: letters, digits, - or _</div>
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 minlength="8" maxlength="128" required />
          <div class="hint" id="pass-hint" data-i18n="auth.pass_hint" hidden>At least 8 characters</div>
        </div>
        <button class="primary" id="submit" type="submit">Sign in</button>
      </form>
    </div>
    <p class="foot"><a href="/" data-i18n="nav.back">← Back to GeoSolver</a></p>
  </main>
<script src="/assets/i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const banner = $('banner'), form = $('form'), submit = $('submit');
  let mode = 'login';

  const t = (k, v) => (window.i18n ? window.i18n.t(k, v) : k);
  function setMode(next, keepFocus) {
    mode = next;
    const login = mode === 'login';
    $('tab-login').setAttribute('aria-selected', login);
    $('tab-register').setAttribute('aria-selected', !login);
    $('heading').textContent = login ? t('auth.welcome') : t('auth.create_head');
    $('subhead').textContent = login ? t('auth.sub_login') : t('auth.sub_register');
    $('submit').textContent = login ? t('nav.signin') : t('nav.create');
    $('password').autocomplete = login ? 'current-password' : 'new-password';
    $('user-hint').hidden = login;
    $('pass-hint').hidden = login;
    banner.className = 'banner';
    if (!keepFocus) $('username').focus();
  }
  $('tab-login').onclick = () => setMode('login');
  $('tab-register').onclick = () => setMode('register');
  // Re-translate the JS-set heading/subhead/button when the language changes.
  document.addEventListener('langchange', () => setMode(mode, true));

  // Open on the tab the caller asked for — the landing page's "Create account"
  // links deep-link here with ?mode=register so they land on sign-up, not sign-in.
  // Always call setMode so the JS-set heading/subhead/button render in the active
  // language (not the static English in the markup).
  const wanted = new URLSearchParams(location.search).get('mode');
  setMode(wanted === 'register' || location.hash === '#register' ? 'register' : 'login');

  function show(kind, msg) { banner.className = 'banner ' + kind; banner.textContent = msg; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = $('username').value.trim(), password = $('password').value;
    if (username.length < 3) return show('err', t('auth.err_user'));
    if (password.length < 8) return show('err', t('auth.err_pass'));
    submit.disabled = true;
    banner.className = 'banner';
    try {
      const res = await fetch('/api/auth/' + (mode === 'login' ? 'login' : 'register'), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        show('ok', t('auth.signed_in', { name: data.username || username }));
        location.href = '/app';
      } else {
        show('err', data.error || t('auth.generic_err'));
      }
    } catch {
      show('err', t('auth.net_err'));
    } finally {
      submit.disabled = false;
    }
  });

  $('username').focus();
</script>
</body>
</html>
