# TLS reverse proxy for GeoSolver.
# Place fullchain.pem + privkey.pem in deploy/certs/ (or use certbot, then point
# these paths at /etc/letsencrypt/live/<domain>/).

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Health check can stay on plain HTTP (for load balancers); redirect the rest.
    location = /healthz { proxy_pass http://app:8787/healthz; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Match the app body limit (8 MB) with a little headroom for base64 overhead.
    client_max_body_size 12m;
    # The shortest-proof search and photo translation can take up to ~60-90s.
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_types application/json image/svg+xml text/plain text/css application/javascript;

    location / {
        proxy_pass         http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach
        # the app's per-IP rate limiter.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
