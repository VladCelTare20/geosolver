# TLS reverse proxy for GeoSolver inside docker compose (option A of DEPLOY.md).
# Certificates: deploy/certs/fullchain.pem + privkey.pem, real files rather than
# symlinks (see DEPLOY.md, "TLS certificates"). For a binary on the host, use
# nginx-host.conf or Caddyfile instead.

# Docker's DNS, asked again every 10 s: `app` is looked up per request through
# the $app variable, so a recreated app container with a new IP is found
# without restarting nginx (a literal proxy_pass host is resolved once, at start).
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    set $app http://app:8787;

    # Let's Encrypt HTTP-01 challenges, written by `certbot --webroot -w deploy/acme`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Plain-HTTP health check for load balancers; everything else goes to HTTPS.
    location = /healthz {
        proxy_pass $app;
        proxy_set_header Host $host;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    set $app http://app:8787;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # The app's body limit (8 MB) plus headroom for base64.
    client_max_body_size 12m;
    # A solve or a photo translation can take up to ~90 s.
    # Above the longest solve: "Keep searching" (AGSTUDIO_EXTENDED_DEADLINE_SECS,
    # 180 s) plus the app's own margin; raise both if you raise the deadlines.
    proxy_read_timeout   240s;
    proxy_send_timeout   240s;

    # One HSTS header: nginx's (also on its own error pages), not the app's too.
    proxy_hide_header  Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_types application/json image/svg+xml text/plain text/css application/javascript;

    location / {
        proxy_pass         $app;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not
        # reach the app's per-IP rate limiter.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
