# Production deployment: GeoSolver behind an nginx TLS reverse proxy.
#
#   1.  cp deploy/.env.example deploy/.env  &&  chmod 600 deploy/.env  &&  edit it
#   2.  put your TLS files in deploy/certs/  (fullchain.pem + privkey.pem)
#   3.  GEOSOLVER_REVISION=$(git rev-parse --short=12 HEAD) \
#         docker compose -f deploy/docker-compose.yml up -d --build
#
# Only nginx is published to the host; the app is reachable only through it.
# deploy/.env is read twice: as the app's environment (env_file) and by compose
# itself for the ${...} values below (build target, limits).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      # runtime = no AI; ai = with the claude CLI (needs CLAUDE_CODE_OAUTH_TOKEN in .env)
      target: ${GEOSOLVER_TARGET:-runtime}
      args:
        GEOSOLVER_REVISION: ${GEOSOLVER_REVISION:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      AGSTUDIO_BIND: "0.0.0.0:8787"
      AGSTUDIO_TRUST_PROXY: "1"
      AGSTUDIO_SECURE_COOKIES: "1"
      # Set AGSTUDIO_PUBLIC_HOST=<your.domain> in .env - the Host check needs it.
    volumes:
      - agstudio-data:/data   # SQLite accounts/sessions/history — survives rebuilds; `down -v` DELETES it
    expose:
      - "8787"          # container network only — NOT published to the host
    # Each solve is a worker process capped at AGSTUDIO_WORKER_MEM_MB (2048);
    # size the box as slots x WORKER_MEM_MB + ~300 MB. The slot count follows
    # the CPU limit (min(max(CPUs,2),8)) unless AGSTUDIO_MAX_CONCURRENT is set.
    cpus: ${GEOSOLVER_CPUS:-2}
    mem_limit: ${GEOSOLVER_MEM_LIMIT:-4g}
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/agstudio:size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.30
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agstudio-data:
