# Production deployment: GeoSolver behind an nginx TLS reverse proxy.
#
#   1.  cp deploy/.env.example deploy/.env   &&   edit AGSTUDIO_BASIC_AUTH
#   2.  put your TLS files in deploy/certs/  (fullchain.pem + privkey.pem)
#   3.  docker compose -f deploy/docker-compose.yml up -d --build
#
# Only nginx is published to the host; the app is reachable only through it.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGSTUDIO_BIND: "0.0.0.0:8787"
      AGSTUDIO_TRUST_PROXY: "1"
      AGSTUDIO_SECURE_COOKIES: "1"
      # Set AGSTUDIO_PUBLIC_HOST=<your.domain> in .env - the Host check needs it.
    volumes:
      - agstudio-data:/data   # SQLite accounts/sessions/history — survives rebuilds
    expose:
      - "8787"          # container network only — NOT published to the host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  agstudio-data:
