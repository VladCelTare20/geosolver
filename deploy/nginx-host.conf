# nginx on the host in front of a native `agstudio serve` (option C of DEPLOY.md),
# which listens on 127.0.0.1:8787 (the systemd unit's default).
# nginx cannot load this file before the certificate exists, and certbot's
# webroot needs nginx serving port 80, so the first certificate takes two steps:
#   sudo mkdir -p /var/www/acme
#   sudo cp deploy/nginx-host.conf /etc/nginx/conf.d/geosolver.conf
#   replace every geo.example.com (4 in the server blocks) with your domain
#   1. comment out the second (443) server block, then
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot certonly --webroot -w /var/www/acme -d geo.example.com
#   2. uncomment it again, then
#      sudo nginx -t && sudo systemctl reload nginx
# Renewals reuse the webroot: certbot renew --deploy-hook "systemctl reload nginx".
# The app needs, in /etc/agstudio.env:
#   AGSTUDIO_PUBLIC_HOST=geo.example.com  AGSTUDIO_TRUST_PROXY=1  AGSTUDIO_SECURE_COOKIES=1

server {
    listen 80;
    listen [::]:80;
    server_name geo.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geo.example.com;

    ssl_certificate     /etc/letsencrypt/live/geo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # The app's body limit (8 MB) plus headroom for base64.
    client_max_body_size 12m;
    # A solve or a photo translation can take up to ~90 s.
    # Above the longest solve: "Keep searching" (AGSTUDIO_EXTENDED_DEADLINE_SECS,
    # 180 s) plus the app's own margin; raise both if you raise the deadlines.
    proxy_read_timeout   240s;
    proxy_send_timeout   240s;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_types application/json image/svg+xml text/plain text/css application/javascript;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not
        # reach the app's per-IP rate limiter.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
