# Drop-in for deploy/agstudio.service that lets the `claude` CLI run under the
# unit's sandbox (Describe, Photo and AI explanations; DEPLOY.md, "AI on a server"):
#   sudo install -Dm644 deploy/agstudio-ai.conf /etc/systemd/system/agstudio.service.d/ai.conf
#   sudo systemctl daemon-reload && sudo systemctl restart agstudio
# /etc/agstudio.env must also hold CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# and AGSTUDIO_CLAUDE_BIN=<absolute path to claude, outside /home and /root>.
# The CLI's JIT needs writable+executable memory, and it keeps its state under
# HOME, which must be inside the StateDirectory (DynamicUser has no home).
[Service]
MemoryDenyWriteExecute=no
Environment=HOME=/var/lib/agstudio CLAUDE_CONFIG_DIR=/var/lib/agstudio/claude DISABLE_AUTOUPDATER=1
